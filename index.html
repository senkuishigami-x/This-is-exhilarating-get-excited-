<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Handloom – shapes from your fingers</title>
<style>
:root{--bg:#07080d;--fg:#e8ecf5;--mut:#8a93a8;--panel:rgba(16,18,28,.8);--line:rgba(255,255,255,.14);--acc:#5ef2e0;--acc2:#ff5fd2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;filter:grayscale(1) contrast(1.1)}
video.mirror{transform:scaleX(-1)}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{pointer-events:none}
header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
h1{margin:0;font:600 15px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase}
h1 span{color:var(--acc)}
#status{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--mut);background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:99px;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status.on{color:var(--acc)}
#intro{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#14172a,var(--bg) 70%);overflow:auto}
.card{max-width:390px;text-align:center}
.card h2{font-size:28px;margin:0 0 10px;letter-spacing:-.01em}
.card p{color:var(--mut);line-height:1.55;margin:0 0 16px;font-size:15px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 18px;font:12px ui-monospace,Menlo,monospace;color:var(--mut)}
.map div{border:1px solid var(--line);border-radius:10px;padding:8px 2px}
.map b{display:block;font-size:20px;color:var(--acc);margin-bottom:2px}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;cursor:pointer;font-size:13px}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary{background:linear-gradient(120deg,var(--acc),var(--acc2));color:#07080d;font-weight:700;border:0;padding:14px 26px;font-size:16px}
button[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
#bar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#help{margin:16px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-align:left;font-size:13px;color:var(--mut);line-height:1.55}
#help b{color:var(--fg)}#help ol{margin:8px 0 0;padding-left:20px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="stage">
<video id="cam" playsinline muted autoplay aria-hidden="true"></video>
<canvas id="art" role="img" aria-label="Pattern drawn from your finger positions"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
</div>

<header>
  <h1>Hand<span>loom</span></h1>
  <div id="status" role="status" aria-live="polite">Starting…</div>
</header>

<section id="intro" aria-labelledby="t">
  <div class="card">
    <h2 id="t">Your fingers make the shape</h2>
    <p>Hold up your hand. The fingers you show become the corners of a shape that follows them live. Video never leaves your phone.</p>
    <div class="map" aria-label="Fingers to shape">
      <div><b>1</b>dot</div><div><b>2</b>line</div><div><b>3</b>triangle</div><div><b>4</b>quad</div><div><b>5</b>pentagon</div>
    </div>
    <p style="font-size:13px">Close your fist to pause. Two hands make two shapes.</p>
    <button class="primary" id="start">Allow camera</button>
    <div id="help" class="hide" role="alert"></div>
  </div>
</section>

<nav id="bar" class="hide" aria-label="Controls">
  <button id="shape">Shape: Polygon</button>
  <button id="sym">Mirrors: 1</button>
  <button id="pen">Pen: Always</button>
  <button id="fade" aria-pressed="true">Fade</button>
  <button id="vid" aria-pressed="true">Video</button>
  <button id="flip">Flip cam</button>
  <button id="clr">Clear</button>
  <button id="save">Save</button>
</nav>

<script type="module">
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id);
const cam=$('cam'),cv=$('art'),ctx=cv.getContext('2d'),hud=$('hud'),hx=hud.getContext('2d'),stEl=$('status');
const setSt=(t,on)=>{stEl.textContent=t;stEl.classList.toggle('on',!!on)};
let vw=0,vh=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;
  const keep=document.createElement('canvas');keep.width=cv.width;keep.height=cv.height;if(cv.width)keep.getContext('2d').drawImage(cv,0,0);
  for(const c of[cv,hud]){c.width=Math.round(vw*DPR);c.height=Math.round(vh*DPR)}
  ctx.setTransform(DPR,0,0,DPR,0,0);hx.setTransform(DPR,0,0,DPR,0,0);
  if(keep.width)ctx.drawImage(keep,0,0,vw,vh);}
addEventListener('resize',resize);resize();

const SHAPES=['Polygon','Web','Circle','Trails'],SYMS=[1,2,4,8],NAMES=['fist','dot','line','triangle','quad','pentagon'];
const TIPS=[4,8,12,16,20],PIPS=[2,6,10,14,18];
let landmarker=null,stream=null,facing='user',camOn=false,shape=0,symI=0,fadeOn=true,pinchPen=false,hands=[],hue=180,lastT=-1,loopOn=false;

// ---------- permission help (Chrome on Android)
function showHelp(n){
  const insecure=!window.isSecureContext||n==='Insecure';
  const steps=insecure?['This page must be opened over https (for example your github.io link)','Do not open the downloaded file directly']:
   ['Tap the lock or tune icon left of the address bar \u2192 Permissions \u2192 Camera \u2192 Allow','Or Chrome menu \u22ee \u2192 Settings \u2192 Site settings \u2192 Camera \u2192 allow this site','Also check Android Settings \u2192 Apps \u2192 Chrome \u2192 Permissions \u2192 Camera \u2192 Allow','Come back here \u2013 the camera starts automatically'];
  const h=$('help');
  h.innerHTML='<b>'+(n==='NotAllowedError'?'Chrome is blocking the camera':n==='NotReadableError'?'Another app is using the camera':'Camera couldn\u2019t start')+'</b><ol>'+steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>';
  h.classList.remove('hide');$('intro').classList.remove('hide');$('start').textContent='Allow camera & try again';
}

// ---------- model
async function loadModel(){
  setSt('Loading hand model…');
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const mk=d=>HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:d},
    runningMode:"VIDEO",numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
  try{landmarker=await mk("GPU")}catch(e){landmarker=await mk("CPU")}
}
let modelP=null;

// ---------- camera
async function startCam(){
  setSt('Waiting for Chrome permission…');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Object.assign(new Error('x'),{name:'Insecure'});
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480},frameRate:{ideal:30,max:30}},audio:false});
    cam.srcObject=stream;await cam.play();
    cam.classList.toggle('mirror',facing==='user');
    camOn=true;$('intro').classList.add('hide');$('bar').classList.remove('hide');
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
    if(!landmarker){if(!modelP)modelP=loadModel();try{await modelP}catch(e){modelP=null;setSt('Hand model failed to load – check internet');return}}
    setSt('Show your hand');
    if(!loopOn){loopOn=true;requestAnimationFrame(loop)}
  }catch(e){setSt('Camera error: '+((e&&e.name)||'unknown'));showHelp(e&&e.name)}
}
$('start').onclick=startCam;
addEventListener('load',startCam);
try{navigator.permissions.query({name:'camera'}).then(p=>{p.onchange=()=>{if(p.state==='granted'&&!camOn)startCam()}}).catch(()=>{})}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;
  if(!camOn&&!$('intro').classList.contains('hide'))startCam();
  else if(stream&&stream.getTracks().some(t=>t.readyState==='ended')){camOn=false;startCam()}});

// ---------- geometry
function toScreen(p){const cw=cam.videoWidth,ch=cam.videoHeight,s=Math.max(vw/cw,vh/ch);
  const nx=facing==='user'?1-p.x:p.x;return{x:nx*cw*s+(vw-cw*s)/2,y:p.y*ch*s+(vh-ch*s)/2}}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function analyse(res){
  const out=[];
  (res.landmarks||[]).forEach((lm,i)=>{
    let pts=lm.map(toScreen);const old=hands[i];
    if(old)pts=pts.map((p,k)=>({x:old.pts[k].x+(p.x-old.pts[k].x)*.55,y:old.pts[k].y+(p.y-old.pts[k].y)*.55}));
    const w=pts[0],ext=[
      dist(pts[4],pts[17])>dist(pts[2],pts[17])*1.02,
      ...[1,2,3,4].map(f=>dist(pts[TIPS[f]],w)>dist(pts[PIPS[f]],w)*1.08)];
    const palm=dist(pts[0],pts[9]);
    out.push({pts,ext,full:TIPS.map((t,f)=>ext[f]?pts[t]:null),pinch:dist(pts[4],pts[8])<palm*.3});
  });
  return out;
}

// ---------- drawing
function renderShape(c,pts,prev,cur){
  if(!pts.length)return;
  const mx=pts.reduce((a,p)=>a+p.x,0)/pts.length,my=pts.reduce((a,p)=>a+p.y,0)/pts.length;
  const ord=[...pts].sort((a,b)=>Math.atan2(a.y-my,a.x-mx)-Math.atan2(b.y-my,b.x-mx));
  c.lineJoin='round';c.lineCap='round';
  if(shape===0){
    if(ord.length===1){c.beginPath();c.arc(ord[0].x,ord[0].y,10,0,6.283);c.stroke()}
    else{c.beginPath();ord.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));if(ord.length>2)c.closePath();
      if(ord.length>2){c.globalAlpha=.18;c.fill();c.globalAlpha=1}c.stroke()}
  }else if(shape===1){
    c.beginPath();for(let i=0;i<ord.length;i++)for(let j=i+1;j<ord.length;j++){c.moveTo(ord[i].x,ord[i].y);c.lineTo(ord[j].x,ord[j].y)}c.stroke();
    ord.forEach(p=>{c.beginPath();c.arc(p.x,p.y,4,0,6.283);c.fill()});
  }else if(shape===2){
    let r=ord.reduce((a,p)=>a+Math.hypot(p.x-mx,p.y-my),0)/ord.length;if(ord.length===1)r=24;
    c.beginPath();c.arc(mx,my,r,0,6.283);c.stroke();c.beginPath();c.arc(mx,my,r*.5,0,6.283);c.stroke();
  }else if(prev){
    c.beginPath();cur.forEach((p,i)=>{if(p&&prev[i]){c.moveTo(prev[i].x,prev[i].y);c.lineTo(p.x,p.y)}});c.stroke();
  }
}
function drawPattern(){
  const N=SYMS[symI],cx=vw/2,cy=vh/2;hue=(hue+1.2)%360;
  ctx.globalCompositeOperation='lighter';ctx.lineWidth=2.4;
  ctx.strokeStyle=`hsla(${hue},95%,62%,.75)`;ctx.fillStyle=`hsla(${hue},95%,62%,.75)`;ctx.shadowColor=`hsl(${hue},100%,60%)`;ctx.shadowBlur=6;
  for(const h of hands){
    if(pinchPen&&!h.pinch)continue;
    const pts=h.full.filter(Boolean);
    for(let k=0;k<N;k++)for(let m=0;m<(N>1?2:1);m++){
      ctx.save();ctx.translate(cx,cy);ctx.rotate(k*2*Math.PI/N);if(m)ctx.scale(1,-1);ctx.translate(-cx,-cy);
      renderShape(ctx,pts,h.prevFull,h.full);ctx.restore()}}
  ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
}
function drawHud(){
  hx.clearRect(0,0,vw,vh);
  for(const h of hands){
    hx.strokeStyle='rgba(255,255,255,.3)';hx.lineWidth=1.5;hx.beginPath();
    for(const c of HandLandmarker.HAND_CONNECTIONS){const a=h.pts[c.start],b=h.pts[c.end];hx.moveTo(a.x,a.y);hx.lineTo(b.x,b.y)}hx.stroke();
    TIPS.forEach((t,f)=>{const p=h.pts[t];hx.beginPath();hx.arc(p.x,p.y,h.ext[f]?12:5,0,6.283);
      if(h.ext[f]){hx.strokeStyle='#5ef2e0';hx.lineWidth=2.5;hx.stroke()}else{hx.fillStyle='rgba(255,255,255,.45)';hx.fill()}});
    if(h.pinch){hx.strokeStyle='#ff5fd2';hx.lineWidth=3;hx.beginPath();hx.moveTo(h.pts[4].x,h.pts[4].y);hx.lineTo(h.pts[8].x,h.pts[8].y);hx.stroke()}
  }
}
function loop(){
  requestAnimationFrame(loop);
  if(fadeOn){ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.06)';ctx.fillRect(0,0,vw,vh);ctx.globalCompositeOperation='source-over'}
  if(!camOn||!landmarker||cam.readyState<2||!cam.videoWidth)return;
  if(cam.currentTime!==lastT){
    lastT=cam.currentTime;
    let res;try{res=landmarker.detectForVideo(cam,performance.now())}catch(e){return}
    const next=analyse(res);next.forEach((h,i)=>{h.prevFull=hands[i]?hands[i].full:null});hands=next;
    if(!hands.length)setSt('Show your hand');
    else setSt(hands.map(h=>{const n=h.ext.filter(Boolean).length;return n+(n===1?' finger':' fingers')+' · '+NAMES[n]}).join('  |  '),true);
  }
  drawPattern();drawHud();
}

// ---------- controls
$('shape').onclick=e=>{shape=(shape+1)%4;e.target.textContent='Shape: '+SHAPES[shape]};
$('sym').onclick=e=>{symI=(symI+1)%4;e.target.textContent='Mirrors: '+SYMS[symI]};
$('pen').onclick=e=>{pinchPen=!pinchPen;e.target.textContent='Pen: '+(pinchPen?'Pinch':'Always')};
$('fade').onclick=e=>{fadeOn=!fadeOn;e.target.setAttribute('aria-pressed',fadeOn)};
$('vid').onclick=e=>{const on=cam.style.visibility!=='hidden';cam.style.visibility=on?'hidden':'visible';e.target.setAttribute('aria-pressed',!on)};
$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';hands=[];startCam()};
$('clr').onclick=()=>ctx.clearRect(0,0,vw,vh);
$('save').onclick=()=>{const o=document.createElement('canvas');o.width=cv.width;o.height=cv.height;const c=o.getContext('2d');c.fillStyle='#07080d';c.fillRect(0,0,o.width,o.height);c.drawImage(cv,0,0);
  o.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='handloom.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)})};
</script>
</body>
</html>
